name: Website CI/CD & Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Verify, Build & Audit Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. Synchronize Site Config & Header/Footer Partials
        run: |
          python automation-scripts/sync_site_config.py

      - name: 2. Compile Documentation Data Store (docs-data.js)
        run: |
          python automation-scripts/build_docs_data.py

      - name: 3. Audit Website Links & Asset References (Zero Broken Links Gate)
        run: |
          python automation-scripts/audit_website_links.py

      - name: Upload Pages Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Upload Build Artifact for Deployment
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: '.'
          include-hidden-files: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    name: Deploy to Firebase Hosting (av.eg1.in)
    needs: validate-and-build
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EG1_PYEGCLAMUI }}'
          channelId: live
          projectId: eg1-pyegclamui
